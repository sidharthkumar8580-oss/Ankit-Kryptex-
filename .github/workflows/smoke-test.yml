name: Test AK-Byte-1 API
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify trained model and API
        run: python tests/smoke_test.py
