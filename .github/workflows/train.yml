name: Train AK-Byte-1 from scratch
on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (start small)"
        required: true
        default: "300"
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install PyTorch
        run: pip install -r requirements.txt
      - name: Train new model from random initialization
        run: python train.py --steps "${{ inputs.steps }}"
      - name: Commit trained weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/weights.pt
          git commit -m "Train AK-Byte-1 model weights" || echo "No weight changes to commit"
          git push
