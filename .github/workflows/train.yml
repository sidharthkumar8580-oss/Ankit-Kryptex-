name: Train AK-Byte-1 from scratch
on:
  push:
    branches: [main]
    paths:
      - "data/train.jsonl"
      - "train.py"
      - "model/network.py"
      - "model/config.py"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:
    inputs:
      steps:
        description: "Training steps (free CPU profile)"
        required: false
        default: "1000"
permissions:
  contents: write
concurrency:
  group: ak-byte-1-training
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PyTorch
        run: pip install -r requirements.txt
      - name: Train AK-Byte-1 with supervised prompt-answer learning
        run: python train.py --steps "${{ inputs.steps || '1000' }}" --batch-size 4 --lr 0.0002
      - name: Commit trained weights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model/weights.pt
          git commit -m "Train AK-Byte-1 from scratch" || echo "No weight changes to commit"
          git push
